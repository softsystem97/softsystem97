{% extends "templates/web.html" %}
{% block page_content %}

<style>
.ss97-admin {
    max-width:900px;
    margin:25px auto;
    padding:24px;
    border:1px solid #d1d5db;
    border-radius:12px;
}
.ss97-admin button {
    padding:12px 20px;
    margin:8px 0;
    border:0;
    border-radius:7px;
    background:#1d4ed8;
    color:white;
}
.ss97-admin button:disabled {
    opacity:0.4;
}
.ss97-admin select {
    width:100%;
    padding:12px;
}
.ss97-admin pre {
    white-space:pre-wrap;
    overflow-wrap:break-word;
    padding:15px;
    background:#f3f4f6;
    color:#111827;
}
</style>

<div class="ss97-admin">

<h1>Soft System 97</h1>

<h2>Administration N2</h2>

<p>Validation des interventions - site pilote</p>

<a href="/login?redirect-to=%2Fadministration-n2%2Finterventions">
Connexion administrative
</a>

<hr>

<button id="refresh">Actualiser les dossiers</button>

<select id="tickets"></select>

<h3 id="subject"></h3>

<p id="technician"></p>

<p id="duration"></p>

<h3>Diagnostic</h3>

<pre id="diagnostic"></pre>

<h3>Rapport technique</h3>

<pre id="report"></pre>

<label>
<input id="approved" type="checkbox">
Je confirme avoir verifie le rapport.
</label>

<br>

<button id="close" disabled>
Valider et cloturer definitivement
</button>

<p id="message" role="status"></p>

</div>

<script>
(() => {

const el = id => document.getElementById(id);

const base =
"/api/method/softsystem97.integrations.ticket_bridge.cockpit_admin.";

let current = null;
let busy = false;

function controls() {

    el("refresh").disabled = busy;
    el("tickets").disabled = busy;

    el("close").disabled =
        busy || !current || !el("approved").checked;
}

function clear() {

    current = null;

    for(const id of [
        "subject","technician","duration",
        "diagnostic","report"
    ]) {

        el(id).textContent = "";
    }

    el("approved").checked = false;

    controls();
}

async function request(method, data={}, post=false) {

    const headers = {
        "Accept":"application/json"
    };

    if(post) {

        headers["Content-Type"] = "application/json";

        headers["X-Frappe-CSRF-Token"] =
            current.csrf_token;
    }

    const response = await fetch(
        base + method +
        (post ? "" : "?" + new URLSearchParams(data)),
        {
            method:post ? "POST" : "GET",
            credentials:"same-origin",
            cache:"no-store",
            headers,
            body:post ? JSON.stringify(data) : undefined
        }
    );

    if(!response.ok)
        throw new Error("HTTP " + response.status);

    return (await response.json()).message;
}

async function review() {

    clear();

    const name = el("tickets").value;

    if(!name) return;

    current = await request("review",{name});

    el("subject").textContent = current.subject;

    el("technician").textContent =
        "Technicien : " + current.technician;

    el("duration").textContent =
        "Duree : " + current.duration + " min";

    el("diagnostic").textContent =
        current.diagnostic || "";

    el("report").textContent =
        current.report || "";
}

async function load() {

    clear();

    const result = await request("pending");

    el("tickets").replaceChildren();

    for(const ticket of result.tickets) {

        const option = document.createElement("option");

        option.value = ticket.name;

        option.textContent =
            ticket.name + " - " + ticket.subject;

        el("tickets").append(option);
    }

    await review();

    if(!result.tickets.length) {

        el("message").textContent =
            "Aucun dossier en attente.";
    }
}

async function perform(fn) {

    if(busy) return;

    busy = true;

    controls();

    try {

        await fn();

    } catch(error) {

        clear();

        el("message").textContent =
            "Operation refusee : " + error.message;

    } finally {

        busy = false;

        controls();
    }
}

el("approved").onchange = controls;

el("refresh").onclick =
    () => perform(load);

el("tickets").onchange =
    () => perform(review);

el("close").onclick = () => perform(async () => {

    if(!current || !el("approved").checked) return;

    await request("close",{
        name:current.ticket,
        expected_modified:current.modified
    },true);

    await load();

    el("message").textContent =
        "Intervention cloturee avec succes.";
});

perform(load);

})();
</script>

{% endblock %}
