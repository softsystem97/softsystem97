name: Frappe Cloud 404 — website-route release preflight
on:
  pull_request:
    paths:
      - 'tools/check_ss97_web_release.py'
      - 'tools/test_ss97_web_release_offline.py'
      - '.github/workflows/ss97-website-route-preflight.yml'
      - 'softsystem97/www/**'
      - 'softsystem97/public/js/ss97_n4_dashboard.js'
      - 'softsystem97/public/js/ss97_cyberos*.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les routes et les scripts du dépôt
        run: |
          python tools/check_ss97_web_release.py
          python -m unittest -q tools.test_ss97_web_release_offline
      - name: Construire et auditer le paquet Python
        run: |
          python -m pip install build
          python -m build --wheel
          python tools/check_ss97_web_release.py --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
      - name: Précision sur la production
        run: echo "Tests hors ligne uniquement. Déploiement bench + mise à jour du site nécessaires."
