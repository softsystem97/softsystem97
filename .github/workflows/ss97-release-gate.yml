name: SS97 - Gate integrite paiements et techniciens

on:
  push:
    branches:
      - feature/ss97-final-integration
  pull_request:
    branches:
      - main
      - feature/ss97-final-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ss97-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-code:
    name: Validation automatique - sans encaissement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer la version GitHub
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuser les secrets Stripe suivis par Git
        run: python tools/check_stripe_secrets.py

      - name: Compilation des modules du projet
        run: python -m compileall -q softsystem97/integrations

      - name: Controle facture - ticket - technicien
        run: python -m unittest discover -s tools -p 'test_ss97_payment_gate.py' -v

      - name: Controle comptable Stripe hors Frappe
        run: python -m unittest discover -s tools -p 'test_ss97_stripe_accounting_offline.py' -v

      - name: Controle de preconditions de livraison
        run: python -m unittest discover -s tools -p 'test_ss97_readiness.py' -v

      - name: Webhooks, configuration et reprises Stripe
        run: python -m unittest discover -s tools -p 'test_stripe_hardening.py' -v

      - name: Etat de livraison
        run: |
          echo "Tests statiques/hors ligne executes."
          echo "Aucun webhook Stripe configure par ce workflow."
          echo "Aucun paiement LIVE ni deploiement Frappe Cloud effectue."
          echo "Tests reel ERPNext et configurations LIVE obligatoires avant publication."

  native-accounting:
    name: ERPNext v16 - comptabilite sur site jetable
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ss97-disposable-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          path: source/softsystem97
      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: 90c8b61afd60ee49f982ca1a9751008e4ae1e24c
          path: source/frappe
      - uses: actions/checkout@v4
        with:
          repository: frappe/erpnext
          ref: 9cd11b19575bfc34f092a24f6c8b368c4dd69481
          path: source/erpnext
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Installer les dependances natives
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmariadb-dev pkg-config mariadb-client
          python -m pip install uv
          uv venv audit-bench/env
          uv pip install --python audit-bench/env/bin/python -e source/frappe -e source/erpnext -e source/softsystem97
      - name: Preparer le bench jetable
        run: |
          mkdir -p audit-bench/sites audit-bench/apps audit-bench/logs
          ln -s ../../source/frappe audit-bench/apps/frappe
          ln -s ../../source/erpnext audit-bench/apps/erpnext
          ln -s ../../source/softsystem97 audit-bench/apps/softsystem97
          printf 'frappe\nerpnext\nsoftsystem97\n' > audit-bench/sites/apps.txt
          cat > audit-bench/sites/common_site_config.json <<'JSON'
          {"db_host":"127.0.0.1","db_port":3306,"redis_cache":"redis://127.0.0.1:6379/0","redis_queue":"redis://127.0.0.1:6379/1","redis_socketio":"redis://127.0.0.1:6379/2"}
          JSON
      - name: Installer le site et executer les tests Frappe
        working-directory: audit-bench
        env:
          SS97_CI_DB_PASSWORD: ss97-disposable-ci-only
        run: |
          env/bin/python ../source/softsystem97/tools/prepare_stripe_ci_site.py
          env/bin/python ../source/softsystem97/tools/run_local_tests.py --site test_stripe
