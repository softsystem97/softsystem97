name: SS97 TECH OS - vérifications hors production

on:
  pull_request:
    paths:
      - 'softsystem97/technician_os/**'
      - 'softsystem97/technician_exams/**'
      - 'softsystem97/softsystem97/doctype/ss97_technician_*/**'
      - 'softsystem97/www/ss97-tech-*'
      - 'softsystem97/www/ss97-client-missions.*'
      - 'softsystem97/public/js/ss97_tech_*.js'
      - 'softsystem97/public/js/ss97_client_missions.js'
      - 'softsystem97/public/css/ss97_tech_*.css'
      - 'tools/test_ss97_tech_os_offline.py'
      - 'tools/test_ss97_technician_exams_offline.py'
      - 'tools/test_ss97_technician_documents_offline.py'
      - 'tools/test_ss97_technician_workflow_v2_offline.py'
      - 'tools/test_ss97_public_ui_contract_offline.py'
      - '.github/workflows/ss97-tech-os-pilot.yml'
  workflow_dispatch:

jobs:
  offline-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances utilisées par les tests PDF
        run: python -m pip install 'reportlab>=4.2,<5' 'pypdf>=5,<7'
      - name: API, filières, justificatifs, notifications et rémunération - tests hors production
        run: python -m unittest -q tools.test_ss97_tech_os_offline tools.test_ss97_technician_exams_offline tools.test_ss97_technician_documents_offline tools.test_ss97_technician_workflow_v2_offline tools.test_ss97_public_ui_contract_offline
      - name: JavaScript navigateur - syntaxe
        run: |
          node --check softsystem97/public/js/ss97_tech_os.js
          node --check softsystem97/public/js/ss97_tech_universe.js
          node --check softsystem97/public/js/ss97_tech_admin.js
          node --check softsystem97/public/js/ss97_client_missions.js
          node --check softsystem97/public/js/ss97_tech_readiness.js
      - name: Modules Python - compilation
        run: python -m compileall -q softsystem97/technician_os softsystem97/technician_exams
